<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Платформа Ведун — API</title>
    <meta name="description" content="Платформа Ведун — API сервис" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
        display: grid;
        place-items: center;
        background: radial-gradient(1000px 600px at 50% -10%, rgba(99,102,241,0.15), transparent) fixed,
                    linear-gradient(180deg, rgba(0,0,0,0.02), transparent 120px) fixed;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 720px;
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      }
      @media (prefers-color-scheme: dark) {
        .card {
          background: rgba(20,20,25,0.6);
          border-color: rgba(255,255,255,0.08);
        }
      }
      h1 {
        margin: 0 0 16px;
        font-size: 32px;
        text-align: center;
        letter-spacing: 0.2px;
      }
      p.desc {
        margin: 0 0 24px;
        text-align: center;
        color: #6b7280;
      }
      .links {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        margin-top: 12px;
      }
      a.link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(0,0,0,0.08);
        text-decoration: none;
        color: inherit;
        background: rgba(255,255,255,0.6);
        transition: transform .06s ease, box-shadow .2s ease, background .2s ease;
      }
      a.link:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        background: rgba(255,255,255,0.8);
      }
      @media (prefers-color-scheme: dark) {
        a.link {
          border-color: rgba(255,255,255,0.08);
          background: rgba(30,30,36,0.6);
        }
        a.link:hover {
          background: rgba(30,30,36,0.8);
        }
      }
      .footer {
        margin-top: 20px;
        text-align: center;
        font-size: 12px;
        color: #9ca3af;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        background: rgba(0,0,0,0.06);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <h1>Платформа Ведун</h1>
      <p class="desc">API работает. Используйте разделы ниже или обращайтесь к префиксу <code>/api</code>.</p>
      <div class="links">
        <a class="link" href="/api" rel="noopener">/api</a>
        <a class="link" href="/api/auth/ping" rel="noopener">/api/auth/ping</a>
        <a class="link" href="/api/users/ping" rel="noopener">/api/users/ping</a>
        <a class="link" href="/api/insured/ping" rel="noopener">/api/insured/ping</a>
        <a class="link" href="/api/surveys/ping" rel="noopener">/api/surveys/ping</a>
      </div>
      <div class="footer">Vedun <span id="year"></span><span data-version-year></span></div>
      
    </main>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
         // Аккуратно загружаем версию с таймаутом
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 4000);

      fetch('/api/version', { cache: 'no-store', signal: ctrl.signal })
        .then(async (res) => {
          if (!res.ok) return;
          // Пытаемся прочитать JSON безопасно
          let data = null;
          try { data = await res.json(); } catch { return; }
          if (!data || typeof data.version !== 'string') return;
          const vYearEl = document.querySelector('[data-version-year]');
          if (vYearEl) vYearEl.textContent = `• v${data.version}`;
        })
        .catch(() => { /* тихо игнорируем */ })
      .finally(() => clearTimeout(timeout));

    </script>
  </body>
</html>
